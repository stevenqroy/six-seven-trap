<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Six Seven Ranch — Dashboard</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --text: #1a1d23;
      --secondary: #5e6478;
      --muted: #8b91a3;
      --border: #e2e5eb;
      --border-light: #eef0f4;
      --done: #1a8a4a;
      --done-bg: #e6f5ed;
      --wip: #b8860b;
      --wip-bg: #fef8e7;
      --review: #2563eb;
      --review-bg: #eff4ff;
      --blocked: #d93025;
      --blocked-bg: #fef0ef;
      --next: #6b46c1;
      --next-bg: #f3f0ff;
      --skip: #9a9fb2;
      --skip-bg: #f5f5f7;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      display: grid;
      gap: 16px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .header-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .header-controls .source-info {
      font-size: 12px;
      color: var(--muted);
    }

    button {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: var(--bg); }

    .btn-sm { padding: 4px 10px; font-size: 12px; }

    input[type="file"] { display: none; }

    .error-text { color: var(--blocked); font-size: 12px; }

    /* Goal tracker */
    .goal-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 24px;
    }

    .goal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .goal-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .goal-pct {
      font-size: 24px;
      font-weight: 700;
      color: var(--done);
    }

    .goal-track {
      width: 100%;
      height: 10px;
      background: #e8ecf1;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .goal-track > span {
      display: block;
      height: 100%;
      background: var(--done);
      border-radius: 999px;
      transition: width 0.3s;
    }

    .goal-subtitle {
      font-size: 13px;
      color: var(--secondary);
      line-height: 1.5;
    }

    /* What's next section */
    .whats-next { display: grid; gap: 8px; }

    .next-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      cursor: pointer;
      transition: box-shadow 0.15s;
    }

    .next-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

    .next-item.item-ready {
      border-left: 4px solid var(--next);
    }

    .next-item.item-blocked {
      border-left: 4px solid var(--blocked);
      opacity: 0.7;
    }

    .next-item.item-wip {
      border-left: 4px solid var(--wip);
    }

    .next-item.item-review {
      border-left: 4px solid var(--review);
    }

    .next-marker {
      font-size: 20px;
      flex-shrink: 0;
      width: 28px;
      text-align: center;
    }

    .next-body {
      flex: 1;
      min-width: 200px;
    }

    .next-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .next-subtitle {
      font-size: 13px;
      color: var(--secondary);
    }

    .next-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-dispatch {
      border: 1px solid var(--border);
      color: var(--text);
      background: var(--surface);
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-dispatch:hover { background: var(--bg); }

    .btn-dispatch.copied {
      background: var(--done-bg);
      border-color: #c3e3d0;
      color: var(--done);
    }

    /* Lightbox */
    .lightbox-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .lightbox-overlay.show {
      display: flex;
    }

    .lightbox {
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      max-width: 520px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 28px;
      position: relative;
    }

    .lb-close {
      position: absolute;
      top: 14px;
      right: 14px;
      background: none;
      border: none;
      font-size: 22px;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .lb-close:hover { background: var(--bg); color: var(--text); }

    .lb-badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .lb-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.3;
      padding-right: 32px;
    }

    .lb-summary {
      font-size: 15px;
      line-height: 1.65;
      color: var(--secondary);
      margin-bottom: 20px;
    }

    .lb-meta {
      display: grid;
      gap: 8px;
      padding-top: 16px;
      border-top: 1px solid var(--border-light);
      margin-bottom: 20px;
    }

    .lb-meta-row {
      display: flex;
      gap: 10px;
      font-size: 13px;
    }

    .lb-meta-label {
      color: var(--muted);
      font-weight: 600;
      min-width: 80px;
      font-size: 11px;
      text-transform: uppercase;
    }

    .lb-meta-value { color: var(--text); }

    .lb-dispatch {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 16px;
      border-top: 1px solid var(--border-light);
    }

    .lb-dispatch-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      width: 100%;
      margin-bottom: 4px;
    }

    .btn-dispatch-lg {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-dispatch-lg:hover { background: var(--bg); border-color: var(--text); }

    .btn-dispatch-lg.copied {
      background: var(--done-bg);
      border-color: #c3e3d0;
      color: var(--done);
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-light);
    }

    .card-head h2 {
      font-size: 15px;
      font-weight: 600;
    }

    .card-body { padding: 16px 20px; }

    /* View toggle */
    .toggle-group {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .toggle-group button {
      border: none;
      border-radius: 0;
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
    }

    .toggle-group button + button { border-left: 1px solid var(--border); }

    .toggle-group button.active {
      background: var(--text);
      color: white;
    }

    /* Kanban */
    .kanban {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .kanban-col { display: flex; flex-direction: column; gap: 8px; }

    .col-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .col-header .col-ct {
      font-size: 11px;
      font-weight: 500;
      opacity: 0.6;
    }

    .col-wip { background: var(--wip-bg); color: var(--wip); }
    .col-review { background: var(--review-bg); color: var(--review); }
    .col-next { background: var(--next-bg); color: var(--next); }
    .col-blocked { background: var(--blocked-bg); color: var(--blocked); }

    .k-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: grid;
      gap: 4px;
      cursor: pointer;
      transition: box-shadow 0.15s;
    }

    .k-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

    .k-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .k-id { font-size: 11px; font-weight: 600; color: var(--muted); }
    .k-name { font-size: 13px; font-weight: 500; line-height: 1.35; }

    .k-status { margin-top: 4px; }
    .k-status .badge { font-size: 11px; padding: 2px 8px; }
    .k-meta {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 2px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 1px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--secondary);
    }

    .groomed-yes { color: var(--done); font-size: 13px; }
    .groomed-no { color: var(--border); font-size: 13px; }

    /* Done summary */
    .done-summary {
      background: var(--done-bg);
      border: 1px solid #c3e3d0;
      border-radius: var(--radius);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .done-summary .done-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--done);
    }

    .done-detail { display: none; }
    .done-detail.show { display: block; }

    .done-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 6px;
      padding: 12px 20px 16px;
    }

    .done-chip {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--done-bg);
      border: 1px solid #c3e3d0;
      color: var(--done);
      font-weight: 500;
    }

    /* Backlog table */
    .table-wrap { overflow: auto; }

    table { width: 100%; border-collapse: collapse; min-width: 600px; }

    th, td {
      text-align: left;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-light);
      font-size: 13px;
    }

    th {
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      background: #fafbfc;
      position: sticky;
      top: 0;
    }

    tr:last-child td { border-bottom: 0; }
    tr.backlog-row { cursor: pointer; }
    tr.backlog-row:hover { background: var(--bg); }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-done { background: var(--done-bg); color: var(--done); }
    .badge-wip { background: var(--wip-bg); color: var(--wip); }
    .badge-review { background: var(--review-bg); color: var(--review); }
    .badge-reviewing { background: var(--wip-bg); color: var(--wip); }
    .badge-blocked { background: var(--blocked-bg); color: var(--blocked); }
    .badge-next { background: var(--next-bg); color: var(--next); }
    .badge-skip { background: var(--skip-bg); color: var(--skip); }
    .badge-unknown { background: var(--skip-bg); color: var(--skip); }

    .groomed-cell { text-align: center; }

    .backlog-divider td {
      background: var(--bg);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      padding: 8px 14px;
      border-bottom: 2px solid var(--border);
    }

    /* Collapsible */
    details.card > summary {
      cursor: pointer;
      list-style: none;
      padding: 14px 20px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    details.card > summary::-webkit-details-marker { display: none; }

    details.card > summary::after {
      content: '\25B8';
      font-size: 12px;
      color: var(--muted);
      transition: transform 0.2s;
    }

    details[open] > summary::after { transform: rotate(90deg); }

    /* Fallback (hidden by default) */
    .fallback-section { display: none; }
    .fallback-section.show { display: block; }

    .fallback-section textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      background: #fafbfc;
      color: var(--text);
    }

    /* Ownership */
    .owner-bars { display: grid; gap: 8px; }

    .owner-row {
      display: grid;
      grid-template-columns: 100px 1fr 30px;
      gap: 8px;
      align-items: center;
      font-size: 13px;
    }

    .owner-row .rail {
      height: 8px;
      border-radius: 999px;
      background: #e8ecf1;
      overflow: hidden;
    }

    .owner-row .fill {
      height: 100%;
      background: var(--review);
      border-radius: 999px;
    }

    /* Merge timeline */
    .timeline { display: grid; gap: 10px; }

    .tl-item {
      display: flex;
      gap: 10px;
      align-items: baseline;
      font-size: 13px;
    }

    .tl-item .tl-date {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      min-width: 80px;
    }

    .tl-item strong { font-weight: 600; }
    .tl-item .tl-desc { color: var(--secondary); }

    /* Story log */
    .story-entries { display: grid; gap: 16px; }

    .story-entry {
      padding-left: 16px;
      border-left: 3px solid var(--border);
    }

    .story-entry .story-date {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 4px;
    }

    .story-entry .story-text {
      font-size: 14px;
      line-height: 1.55;
      color: var(--text);
    }

    /* Research cards */
    .research-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
    }

    .research-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      cursor: pointer;
      transition: box-shadow 0.15s;
    }

    .research-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

    .research-card .rc-name {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .research-card .rc-desc {
      font-size: 12px;
      color: var(--secondary);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .research-card .rc-who {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }

    .btn-groom {
      background: var(--next-bg);
      border: 1px solid #d4ccf0;
      color: #4c2d99;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      padding: 3px 10px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-groom:hover { background: #e8e0f5; }

    .btn-groom.copied {
      background: var(--done-bg);
      border-color: #c3e3d0;
      color: var(--done);
    }

    .hidden { display: none !important; }

    @media (max-width: 900px) {
      .kanban { grid-template-columns: 1fr; }
      .goal-bar { padding: 16px; }
      .header { flex-direction: column; align-items: flex-start; }
      .done-grid { grid-template-columns: 1fr 1fr; }
      .lightbox { margin: 10px; padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Header -->
    <div class="header">
      <h1>Six Seven Ranch</h1>
      <div class="header-controls">
        <span id="sourceInfo" class="source-info"></span>
        <span id="errorText" class="error-text"></span>
        <button id="loadBtn" class="btn-sm" type="button">Load</button>
        <button id="reloadBtn" class="btn-sm" type="button">Refresh</button>
        <label><input id="fileInput" type="file" accept=".md,text/markdown,text/plain"><button id="fileBtn" class="btn-sm" type="button">Upload</button></label>
        <button id="pasteToggle" class="btn-sm" type="button">Paste</button>
      </div>
    </div>

    <!-- Paste fallback (hidden) -->
    <div id="fallbackSection" class="fallback-section">
      <div class="card">
        <div class="card-body" style="display:grid;gap:8px">
          <textarea id="pasteArea" placeholder="Paste TICKETS.md content here..."></textarea>
          <div><button id="renderPasteBtn" type="button">Render</button></div>
        </div>
      </div>
    </div>

    <!-- Goal tracker -->
    <div class="goal-bar" id="goalBar">
      <div class="goal-top">
        <span class="goal-title">Loading...</span>
        <span class="goal-pct" id="goalPct"></span>
      </div>
      <div class="goal-track" id="goalTrack"><span style="width:0%"></span></div>
      <div class="goal-subtitle" id="goalSub"></div>
    </div>

    <!-- What's next -->
    <div id="whatsNext" class="whats-next"></div>

    <!-- Board -->
    <div class="card">
      <div class="card-head">
        <h2>Board</h2>
        <div class="toggle-group">
          <button id="viewBoard" class="active" type="button">Board</button>
          <button id="viewBacklog" type="button">Backlog</button>
        </div>
      </div>
      <div class="card-body">
        <div id="kanbanBoard" class="kanban"></div>
        <div id="backlogList" class="hidden"></div>
      </div>
    </div>

    <!-- Research -->
    <div id="researchSection"></div>

    <!-- Done -->
    <div id="doneSection"></div>

    <!-- Story -->
    <details class="card" id="storyCard" open>
      <summary>The Story So Far</summary>
      <div class="card-body" id="storyBody"></div>
    </details>

    <!-- Extras -->
    <details class="card" id="mergeCard">
      <summary>Merge Log</summary>
      <div class="card-body" id="mergeTimeline"></div>
    </details>

    <details class="card" id="ownerCard">
      <summary>Ownership</summary>
      <div class="card-body" id="ownerBody"></div>
    </details>
  </div>

  <!-- Lightbox -->
  <div class="lightbox-overlay" id="lightboxOverlay">
    <div class="lightbox" id="lightboxContent"></div>
  </div>

  <script>
    const BADGE_CLASS = {
      done: 'badge-done', wip: 'badge-wip', review: 'badge-review', reviewing: 'badge-reviewing',
      blocked: 'badge-blocked', next: 'badge-next', skip: 'badge-skip', unknown: 'badge-unknown',
    };

    const PHASES = [
      { label: 'Infrastructure', tickets: ['S7R-001','S7R-002','S7R-003','S7R-004'] },
      { label: 'Mobile baseline', tickets: ['S7R-005','S7R-007','S7R-008'] },
      { label: 'Enemy runtime', tickets: ['S7R-010','S7R-011','S7R-015','S7R-018'] },
      { label: 'Commands + supports', tickets: ['S7R-046','S7R-047','S7R-048','S7R-050','S7R-051','S7R-053'] },
      { label: 'PWA', tickets: ['S7R-038'] },
      { label: 'Ability VFX', tickets: ['S7R-071','S7R-072','S7R-073'] },
      { label: 'Gate-1 Playtest', names: ['V1-PLAYTEST-GATE-1'] },
      { label: 'Polish pass', tickets: ['S7R-054'] },
      { label: 'Launch prep', tickets: ['S7R-055'] },
      { label: 'Gate-2 Playtest', names: ['V1-PLAYTEST-GATE-2'] },
    ];

    const BOARD_COLUMNS = [
      { key: 'wip', label: 'In Progress', cls: 'col-wip' },
      { key: 'review', label: 'Review', cls: 'col-review', statuses: ['review', 'reviewing'] },

    /* Utilities */

    function setError(msg) { document.getElementById('errorText').textContent = msg; }

    function setSource(msg) { document.getElementById('sourceInfo').textContent = msg; }

    function esc(v) {
      return String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
        .replaceAll('"','&quot;').replaceAll("'",'&#39;');
    }

    function plain(v) {
      return String(v ?? '').replace(/`/g,'').replace(/\*\*/g,'').replace(/\*/g,'')
        .replace(/_/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').trim();
    }

    function normStatus(raw) {
      const s = plain(raw).toLowerCase();
      if (s.startsWith('done')) return 'done';
      if (s.startsWith('wip')) return 'wip';
      if (s === 'reviewing') return 'reviewing';
      if (s.startsWith('review')) return 'review';
      if (s.startsWith('blocked')) return 'blocked';
      if (s.startsWith('next')) return 'next';
      if (s.startsWith('skip')) return 'skip';
      return 'unknown';
    }

    /* Friendly name helpers */

    function friendlyTitle(ticket) {
      const id = ticket.ticket || ticket.name || '';
      const f = FRIENDLY[id] || FRIENDLY[ticket.name];
      if (f) return f.title;
      return ticket.name || id;
    }

    function friendlySummary(ticket) {
      const id = ticket.ticket || ticket.name || '';
      const f = FRIENDLY[id] || FRIENDLY[ticket.name];
      if (f) return f.summary;
      return `This task is called "${ticket.name || id}."`;
    }

    function friendlyMarker(ticket) {
      const id = ticket.ticket || ticket.name || '';
      const f = FRIENDLY[id] || FRIENDLY[ticket.name];
      if (f) return f.marker;
      if (ticket.status === 'next') return '\u{1F449}';
      if (ticket.status === 'blocked') return '\u23F3';
      if (ticket.status === 'wip') return '\u{1F6E0}\uFE0F';
      if (ticket.status === 'review') return '\u{1F50D}';
      if (ticket.status === 'reviewing') return '\u{1F9D0}';
      return '\u{1F4CB}';
    }

    function friendlyWho(ticket) {
      const o = ticket.owner;
      if (o && o !== '\u2014' && o !== '-') return o;
      const p = ticket.platform || '';
      if (p.includes('steven')) return 'Steven';
      if (p.includes('claude')) return 'Claude';
      if (p.includes('codex')) return 'Codex';
      if (p.includes('gemini')) return 'Gemini';
      return null;
    }

    function friendlyBlockerName(raw, tickets) {
      const norm = raw.trim();
      for (const t of tickets) {
        const id = t.ticket || t.name;
        if (id === norm || id === 'S7R-' + norm || t.name === norm) {
          return friendlyTitle(t).toLowerCase();
        }
      }
      if (norm.toLowerCase().includes('gate')) return 'the playtest';
      return norm;
    }

    function getDispatchPlatforms(ticket) {
      const p = (ticket.platform || '').toLowerCase();

      if (p.includes('claude')) platforms.push('Claude');
      if (p.includes('codex')) platforms.push('Codex');
      if (p.includes('gemini')) platforms.push('Gemini');
      if (p.includes('steven')) platforms.push('Steven');
      if (!platforms.length) platforms.push('Claude', 'Codex');
      return platforms;

      const id = ticket.ticket || ticket.name;
      const name = ticket.name || '';

      return `Read and strictly follow the updated AGENTS.md rules and checklists before doing anything else.\n\n${platform}: please start ${id} \u2014 ${name}.\nBranch: ${p}/${id}\n\nSTEP 1: Read AGENTS.md completely \u2014 follow the startup protocol and worktree protocol exactly.\nSTEP 2: Create a worktree for your branch:\n        git fetch origin\n        git worktree add .worktrees/${id} -b ${p}/${id} origin/main 2>/dev/null || git worktree add .worktrees/${id} ${p}/${id}\n        cd .worktrees/${id}\n        Run git branch --show-current and confirm it says ${p}/${id}. STOP if it doesn't.\n        ALL work happens in this directory. Do not cd back to the main workspace.\nSTEP 3: Update TICKETS.md \u2014 set status to wip:${p}, Branch to ${p}/${id}, Owner to ${p}. Commit this change first.\nSTEP 4: Read your ticket's Ready Brief in TICKETS.md (search for "${id} Ready Brief").\nSTEP 5: Implement. Follow AGENTS.md rules, QA gate, and completion handoff format.\nSTEP 6: Before marking review \u2014 rebase onto latest main: git fetch origin && git rebase origin/main. Re-run build after rebase.\nSTEP 7: Commit code and TICKETS.md SEPARATELY (code first, TICKETS.md last). Set status to review. Output the TL;DR handoff from AGENTS.md.`;

    /* Markdown parsing */

    function splitRow(line) {
      return line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c => c.trim());
    }

    function parseMdTable(lines) {
      if (!Array.isArray(lines) || lines.length < 2) return null;
      const headers = splitRow(lines[0]);
      if (!/\|\s*-{3,}/.test(lines[1])) return null;
      const rows = [], objects = [];
      for (let i = 2; i < lines.length; i++) {
        const l = lines[i];
        if (!l.trim() || /^\|\s*-/.test(l.trim())) continue;
        const row = splitRow(l);
        rows.push(row);
        const obj = {};
        headers.forEach((h, idx) => { obj[h] = row[idx] ?? ''; });
        objects.push(obj);
      }
      return { headers, rows, objects };
    }

    function parseTablesWithHeadings(text) {
      const lines = text.split(/\r?\n/);
      const tables = [];
      let heading = '';
      for (let i = 0; i < lines.length; i++) {
        const hm = lines[i].match(/^###\s+(.+)$/);
        if (hm) { heading = hm[1].trim(); continue; }
        if (!lines[i].trim().startsWith('|')) continue;
        const block = [];
        while (i < lines.length && lines[i].trim().startsWith('|')) { block.push(lines[i]); i++; }
        i--;
        const t = parseMdTable(block);
        if (t) { t.heading = heading || 'Overview'; tables.push(t); }
      }
      return tables;
    }

    function escRx(t) { return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    function getSection(md, heading) {
      const lines = md.split(/\r?\n/);
      let capturing = false;
      const out = [];
      for (const line of lines) {
        if (capturing) {
          // Stop at the next ## heading that isn't ### (same-level or higher)
          if (/^## (?!#)/.test(line)) break;
          out.push(line);
        } else if (line.startsWith(heading)) {
          capturing = true;
        }
      }
      return out.join('\n');
    }

    function parseV1(md) {
      const section = getSection(md, '## V1 Track');
      const tables = parseTablesWithHeadings(section);
      const t = tables.find(t => t.headers.includes('Ticket') && t.headers.includes('Status'));
      if (!t) return [];
      return t.objects.map(r => ({
        number: plain(r['#']), ticket: plain(r.Ticket), name: plain(r.Name),
        depends: plain(r.Depends), platform: plain(r['Best platform']),
        statusRaw: plain(r.Status), status: normStatus(r.Status),
        branch: plain(r.Branch), owner: plain(r.Owner),
      }));
    }

    function parseRightNow(md) {
      return parseTablesWithHeadings(getSection(md, '## What can run RIGHT NOW'));
    }

    function parseResearchTasks(rnTables) {
      // Find the table under "Research tasks" heading
      const t = rnTables.find(t => (t.heading || '').toLowerCase().includes('research'));
      if (!t) return [];
      return t.objects.map(r => ({
        name: plain(r.Task || r.Ticket || ''),
        desc: plain(r['TL;DR'] || r.TL || ''),
        who: plain(r['Good for'] || r['Available to'] || ''),
        status: normStatus(r.Status),
      })).filter(r => r.name);
    }

    function parseMergeLog(md) {
      const tables = parseTablesWithHeadings(getSection(md, '## Merge Log'));
      const t = tables.find(t => t.headers.includes('Date') && t.headers.includes('Ticket'));
      if (!t) return [];
      return t.objects.map(r => ({
        date: plain(r.Date), ticket: plain(r.Ticket),
        change: plain(r['What changed']), who: plain(r.Who),
      }));
    }

    function parseStoryLog(md) {
      const section = getSection(md, '## Story Log');
      if (!section.trim()) return [];
      const entries = [];
      const lines = section.split(/\r?\n/);
      let currentDate = '';
      let currentText = [];
      for (const line of lines) {
        const dateMatch = line.match(/^###\s+(.+)$/);
        if (dateMatch) {
          if (currentDate && currentText.length) {
            entries.push({ date: currentDate, text: currentText.join(' ').trim() });
          }
          currentDate = dateMatch[1].trim();
          currentText = [];
          continue;
        }
        const trimmed = line.trim();
        if (trimmed && !trimmed.startsWith('>')) currentText.push(trimmed);
      }
      if (currentDate && currentText.length) {
        entries.push({ date: currentDate, text: currentText.join(' ').trim() });
      }
      return entries;
    }

    function buildGroomedSet(tables) {
      const set = new Set();
      for (const t of tables) {
        const ti = t.headers.findIndex(h => h.toLowerCase() === 'ticket' || h.toLowerCase() === 'task');
        const di = t.headers.findIndex(h => h.toLowerCase().includes('tl;dr') || h.toLowerCase().includes('tldr'));
        if (ti < 0) continue;
        for (const r of t.rows) {
          const id = plain(r[ti]);
          const desc = di >= 0 ? plain(r[di]) : '';
          if (id && desc) set.add(id);
        }
      }
      return set;
    }

    /* Phase helpers */

    function phaseStatus(rows) {
      if (!rows.length) return 'unknown';
      const s = rows.map(r => r.status);
      if (s.every(x => x === 'done')) return 'done';
      if (s.some(x => x === 'wip' || x === 'review')) return 'wip';
      if (s.some(x => x === 'next')) return 'next';
      if (s.some(x => x === 'blocked')) return 'blocked';
      return 'unknown';
    }

    function getCurrentPhase(tickets) {
      const byTicket = new Map(tickets.map(t => [t.ticket, t]));
      const byName = new Map(tickets.map(t => [t.name, t]));
      for (const phase of PHASES) {
        const rows = [];
        (phase.tickets || []).forEach(id => { if (byTicket.has(id)) rows.push(byTicket.get(id)); });
        (phase.names || []).forEach(n => { if (byName.has(n)) rows.push(byName.get(n)); });
        if (phaseStatus(rows) !== 'done') return phase.label;
      }
      return null;
    }

    /* Render: goal tracker */

    function renderGoal(tickets) {
      const total = tickets.length;
      const done = tickets.filter(t => t.status === 'done').length;
      const pct = total ? Math.round((done / total) * 100) : 0;

      const remaining = total - done;
      const active = tickets.filter(t => t.status === 'wip' || t.status === 'review' || t.status === 'reviewing');
      const nextUp = tickets.filter(t => t.status === 'next');

      // Subtitle: what's happening right now
      let sub = '';
      if (pct >= 100) {
        sub = 'All steps are complete. Ready to ship!';
      } else if (active.length) {
        sub = `${remaining} steps left. Currently working on ${friendlyTitle(active[0]).toLowerCase()}.`;
      } else if (nextUp.length) {
        sub = `${remaining} steps left. ${friendlyTitle(nextUp[0])} is ready to start.`;
      } else {
        sub = `${remaining} steps left. Waiting for a blocker to clear.`;
      }

      const bar = document.getElementById('goalBar');
      bar.querySelector('.goal-title').textContent = 'Launch Version 1';
      document.getElementById('goalPct').textContent = pct + '%';
      document.getElementById('goalTrack').innerHTML = `<span style="width:${pct}%"></span>`;
      document.getElementById('goalSub').textContent = sub;
    }

    /* Render: what's next (the action items) */

    function renderWhatsNext(tickets, researchTasks) {
      const items = [];

      // Only show tickets NOT already on the board (wip/review/reviewing/blocked are on the board)
      const nextUp = tickets.filter(t => t.status === 'next');
      for (const t of nextUp) {
        const who = friendlyWho(t);
        const label = who ? `${who} can start this` : 'Ready for someone to pick up';
        items.push({ ticket: t, label, cls: 'item-ready' });
      }

      // Also include research tickets with next status
      if (researchTasks) {
        const nextResearch = researchTasks.filter(r => r.status === 'next');
        for (const r of nextResearch) {
          const fakeTicket = { ticket: r.name, name: r.desc, platform: r.who, status: 'next' };
          const label = r.who ? `${r.who} can start this` : 'Ready for someone to pick up';
          items.push({ ticket: fakeTicket, label, cls: 'item-ready' });
        }
      }

      if (!items.length) {
        document.getElementById('whatsNext').innerHTML = '';
        return;
      }

      document.getElementById('whatsNext').innerHTML = items.map(({ ticket: t, label, cls }) => {
        const id = t.ticket || t.name;
        const title = friendlyTitle(t);
        const marker = friendlyMarker(t);
        const platforms = getDispatchPlatforms(t);
        const dispatchBtns = platforms.map(p =>
          `<button class="btn-sm btn-dispatch" data-ni-dispatch="${esc(id)}" data-ni-platform="${esc(p)}" title="Copy task for ${esc(p)}">\u{1F4CB} ${esc(p)}</button>`
        ).join('');

        return `<div class="next-item ${cls}" data-ni-open="${esc(id)}">
          <span class="next-marker">${marker}</span>
          <div class="next-body">
            <div class="next-title">${esc(title)}</div>
            <div class="next-subtitle">${esc(label)}</div>
          </div>
          <div class="next-actions" onclick="event.stopPropagation()">
            ${dispatchBtns}
          </div>
        </div>`;
      }).join('');

      // Build lookup of all items (V1 tickets + research fake tickets)
      const itemMap = {};
      for (const { ticket: t } of items) {
        const id = t.ticket || t.name;
        itemMap[id] = t;
      }

      // Wire card clicks → lightbox
      document.querySelectorAll('[data-ni-open]').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.getAttribute('data-ni-open');
          const t = allTickets.find(t => (t.ticket || t.name) === id) || itemMap[id];
          if (t) openLightbox(t);
        });
      });

      // Wire dispatch buttons
      document.querySelectorAll('[data-ni-dispatch]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.getAttribute('data-ni-dispatch');
          const platform = btn.getAttribute('data-ni-platform');
          const t = allTickets.find(t => (t.ticket || t.name) === id) || itemMap[id];
          if (!t) return;
          const prompt = buildDispatchPrompt(t, platform);
          navigator.clipboard.writeText(prompt).then(() => {
            btn.classList.add('copied');
            const orig = btn.innerHTML;
            btn.innerHTML = '\u2705 Copied';
            setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 2000);
          });
        });
      });
    }

    /* Render: kanban (active tickets only, no done) */

    function renderKanban(tickets, groomedSet, researchTasks) {
      const grouped = {};
      const statusToCol = {};
      BOARD_COLUMNS.forEach(c => {
        grouped[c.key] = [];
        const statuses = c.statuses || [c.key];
        statuses.forEach(s => { statusToCol[s] = c.key; });
      });
      for (const t of tickets) {
        const col = statusToCol[t.status];
        if (col) grouped[col].push(t);
      }
      // Include active research tickets on the kanban (wip, review, reviewing)
      if (researchTasks) {
        for (const r of researchTasks) {
          const col = statusToCol[r.status];
          if (col && r.status !== 'next' && r.status !== 'done') {
            grouped[col].push({ ticket: r.name, name: r.desc, platform: r.who, status: r.status, _research: true });
          }
        }
      }

      const renderCard = (t) => {
        const id = t.ticket || t.name;
        const title = friendlyTitle(t);
        const isGroomed = groomedSet.has(id);
        const gi = isGroomed
          ? '<span class="groomed-yes" title="Groomed">\u2713</span>'
          : '<span class="groomed-no" title="Not groomed">\u25CB</span>';
        const owner = (t.owner && t.owner !== '\u2014' && t.owner !== '-')
          ? `<span class="pill">${esc(t.owner)}</span>` : '';
        const plat = t.platform ? `<span class="pill">${esc(t.platform)}</span>` : '';
        const showId = t.ticket && t.ticket !== '\u2014' && t.ticket !== '-';

        const statusBadge = (t.status === 'review' || t.status === 'reviewing')
          ? `<span class="badge ${BADGE_CLASS[t.status] || ''}">${esc(statusLabel(t.status))}</span>` : '';

        return `<div class="k-card" data-kcard="${esc(id)}">
          <div class="k-card-top">${showId ? `<span class="k-id">${esc(t.ticket)}</span>` : '<span></span>'}${gi}</div>
          <div class="k-name">${esc(title)}</div>
          ${statusBadge ? `<div class="k-status">${statusBadge}</div>` : ''}
          ${(owner || plat) ? `<div class="k-meta">${owner}${plat}</div>` : ''}
        </div>`;
      };

      document.getElementById('kanbanBoard').innerHTML = BOARD_COLUMNS.map(col => {
        const cards = grouped[col.key];
        return `<div class="kanban-col">
          <div class="col-header ${col.cls}">
            <span>${esc(col.label)}</span>
            <span class="col-ct">${cards.length}</span>
          </div>
          ${cards.map(renderCard).join('')}
        </div>`;
      }).join('');

      // Build lookup of all kanban cards (V1 + research fake tickets)
      const kanbanMap = {};
      for (const col of BOARD_COLUMNS) {
        for (const t of grouped[col.key]) {
          kanbanMap[t.ticket || t.name] = t;
        }
      }

      // Wire board card clicks → lightbox
      document.querySelectorAll('[data-kcard]').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.getAttribute('data-kcard');
          const t = allTickets.find(t => (t.ticket || t.name) === id) || kanbanMap[id];
          if (t) openLightbox(t);
        });
      });
    }

    /* Render: done summary */

    function renderDone(tickets) {
      const done = tickets.filter(t => t.status === 'done');
      if (!done.length) { document.getElementById('doneSection').innerHTML = ''; return; }

      document.getElementById('doneSection').innerHTML = `
        <div class="done-summary" id="doneSummaryBar">
          <span class="done-label">\u2705 ${done.length} steps completed</span>
          <button class="btn-sm" id="doneToggle" type="button">Show all</button>
        </div>
        <div class="done-detail" id="doneDetail">
          <div class="done-grid">
            ${done.map(t => `<div class="done-chip">${esc(friendlyTitle(t))}</div>`).join('')}
          </div>
        </div>
      `;

      document.getElementById('doneToggle').addEventListener('click', () => {
        const detail = document.getElementById('doneDetail');
        const btn = document.getElementById('doneToggle');
        detail.classList.toggle('show');
        btn.textContent = detail.classList.contains('show') ? 'Hide' : 'Show all';
      });
    }

    /* Render: research tasks */

    function renderResearch(tasks) {
      const el = document.getElementById('researchSection');
      if (!tasks.length) { el.innerHTML = ''; return; }

      el.innerHTML = `<div class="card">
        <div class="card-head"><h2>Research &amp; Ideas</h2></div>
        <div class="card-body">
          <div class="research-grid">
            ${tasks.map((t, i) => `<div class="research-card" data-rcard="${i}">
              <div class="rc-name">${esc(t.name)}</div>
              <div class="rc-desc">${esc(t.desc)}</div>
              <div class="rc-who">${esc(t.who)}</div>
            </div>`).join('')}
          </div>
        </div>
      </div>`;

      // Wire clicks → lightbox with full description
      document.querySelectorAll('[data-rcard]').forEach(card => {
        card.addEventListener('click', () => {
          const idx = parseInt(card.getAttribute('data-rcard'), 10);
          const t = tasks[idx];
          if (!t) return;
          document.getElementById('lightboxContent').innerHTML = `
            <button class="lb-close" id="lbClose">\u00D7</button>
            <span class="lb-badge badge-next">Research</span>
            <div class="lb-title">${esc(t.name)}</div>
            <div class="lb-summary">${esc(t.desc)}</div>
            <div class="lb-meta">
              <div class="lb-meta-row"><span class="lb-meta-label">Good for</span><span class="lb-meta-value">${esc(t.who)}</span></div>
            </div>
          `;
          document.getElementById('lightboxOverlay').classList.add('show');
          document.getElementById('lbClose').addEventListener('click', closeLightbox);
        });
      });
    }

    /* Render: backlog table — ALL remaining work (V1 tickets + research) */

    function buildGroomPrompt(name, desc) {
      return `Claude: please groom "${name}" for implementation.\n\nContext: ${desc || 'See TICKETS.md for details.'}\n\nWrite a ready brief: reference files to read, patterns to match, gotchas, acceptance criteria, and test requirements. Update TICKETS.md with the brief.`;
    }

    function renderBacklog(tickets, groomedSet, researchTasks) {
      // All remaining V1 tickets (not done)
      const remaining = tickets.filter(t => t.status !== 'done');

      // Convert research tasks to backlog-compatible rows
      const researchRows = (researchTasks || []).map((r, i) => ({
        number: '',
        ticket: '',
        name: r.name,
        statusRaw: 'research',
        status: 'research',
        platform: r.who,
        owner: '',
        depends: '',
        _desc: r.desc,
        _isResearch: true,
        _rIdx: i,
      }));

      const all = [...remaining, ...researchRows];

      if (!all.length) {
        document.getElementById('backlogList').innerHTML = '<p style="color:var(--muted)">No backlog items.</p>';
        return;
      }

      const isGroomed = (t) => {
        if (t._isResearch) return false;
        if (t.status === 'done') return true;
        return groomedSet.has(t.ticket || t.name);
      };

      const groomed = all.filter(t => isGroomed(t));
      const ungroomed = all.filter(t => !isGroomed(t));

      const statusBadge = (t) => {
        if (t._isResearch) return '<span class="badge badge-next">Research</span>';
        return `<span class="badge ${BADGE_CLASS[t.status] || BADGE_CLASS.unknown}">${esc(statusLabel(t.status))}</span>`;
      };

      const renderRow = (t, g) => {
        const id = t.ticket || t.name;
        const title = t._isResearch ? t.name : friendlyTitle(t);
        const groomBtn = g ? '' : `<button class="btn-sm btn-groom" data-groom="${esc(id)}" title="Copy grooming prompt for Claude" onclick="event.stopPropagation()">\u{1F4DD} Groom</button>`;
        return `<tr class="backlog-row" data-brow="${esc(id)}" data-is-research="${t._isResearch ? '1' : '0'}" data-ridx="${t._rIdx ?? ''}">
          <td>${esc(t.number)}</td>
          <td><strong>${esc(title)}</strong></td>
          <td>${statusBadge(t)}</td>
          <td class="groomed-cell">${g ? '<span class="groomed-yes">\u2713</span>' : '<span class="groomed-no">\u25CB</span>'}</td>
          <td>${esc(t._isResearch ? t.platform : (friendlyWho(t) || '\u2014'))}</td>
          <td>${groomBtn}</td>
        </tr>`;
      };

      const divider = ungroomed.length && groomed.length
        ? `<tr class="backlog-divider"><td colspan="6">Needs grooming</td></tr>`
        : '';

      document.getElementById('backlogList').innerHTML = `
        <div class="table-wrap"><table>
          <thead><tr>
            <th>#</th><th>Task</th><th>Status</th><th>Groomed</th><th>Who</th><th></th>
          </tr></thead>
          <tbody>
            ${groomed.map(t => renderRow(t, true)).join('')}
            ${divider}
            ${ungroomed.map(t => renderRow(t, false)).join('')}
          </tbody>
        </table></div>
      `;

      // Wire backlog row clicks → lightbox
      document.querySelectorAll('[data-brow]').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.getAttribute('data-brow');
          const isR = el.getAttribute('data-is-research') === '1';
          const rIdx = parseInt(el.getAttribute('data-ridx'), 10);
          if (isR && researchTasks && researchTasks[rIdx]) {
            const r = researchTasks[rIdx];
            document.getElementById('lightboxContent').innerHTML = `
              <button class="lb-close" id="lbClose">\u00D7</button>
              <span class="lb-badge badge-next">Research</span>
              <div class="lb-title">${esc(r.name)}</div>
              <div class="lb-summary">${esc(r.desc)}</div>
              <div class="lb-meta">
                <div class="lb-meta-row"><span class="lb-meta-label">Good for</span><span class="lb-meta-value">${esc(r.who)}</span></div>
              </div>
            `;
            document.getElementById('lightboxOverlay').classList.add('show');
            document.getElementById('lbClose').addEventListener('click', closeLightbox);
          } else {
            const t = allTickets.find(t => (t.ticket || t.name) === id);
            if (t) openLightbox(t);
          }
        });
      });

      // Wire groom buttons
      document.querySelectorAll('[data-groom]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.getAttribute('data-groom');
          // Find the name and desc from either tickets or research
          let name = id, desc = '';
          const ticket = allTickets.find(t => (t.ticket || t.name) === id);
          if (ticket) {
            name = ticket.name || id;
            desc = friendlySummary(ticket);
          } else {
            const r = (researchTasks || []).find(r => r.name === id);
            if (r) { name = r.name; desc = r.desc; }
          }
          const prompt = buildGroomPrompt(name, desc);
          navigator.clipboard.writeText(prompt).then(() => {
            btn.classList.add('copied');
            const orig = btn.innerHTML;
            btn.innerHTML = '\u2705 Copied';
            setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 2000);
          });
        });
      });
    }

    /* Render: ownership */

    function renderOwnership(tickets) {
      const counts = {};
      tickets.filter(t => t.status === 'done').forEach(t => {
        if (!t.owner || t.owner === '\u2014' || t.owner === '-') return;
        counts[t.owner] = (counts[t.owner] || 0) + 1;
      });
      const items = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      if (!items.length) {
        document.getElementById('ownerBody').innerHTML = '<p style="color:var(--muted)">No data.</p>';
        return;
      }
      const mx = Math.max(...items.map(i => i[1]));
      document.getElementById('ownerBody').innerHTML = `<div class="owner-bars">
        ${items.map(([o, c]) => {
          const w = Math.max(4, Math.round((c / mx) * 100));
          return `<div class="owner-row">
            <strong>${esc(o)}</strong>
            <div class="rail"><div class="fill" style="width:${w}%"></div></div>
            <span>${c}</span>
          </div>`;
        }).join('')}
      </div>`;
    }

    /* Render: merge log */

    function renderMerge(entries) {
      if (!entries.length) {
        document.getElementById('mergeTimeline').innerHTML = '<p style="color:var(--muted)">No data.</p>';
        return;
      }
      const rev = [...entries].reverse();
      document.getElementById('mergeTimeline').innerHTML = `<div class="timeline">
        ${rev.map(e => `<div class="tl-item">
          <span class="tl-date">${esc(e.date)}</span>
          <strong>${esc(e.ticket)}</strong>
          <span class="tl-desc">${esc(e.change)}</span>
        </div>`).join('')}
      </div>`;
    }

    /* Render: story log */

    function renderStory(entries) {
      if (!entries.length) {
        document.getElementById('storyBody').innerHTML = '<p style="color:var(--muted)">No story entries yet.</p>';
        return;
      }
      const rev = [...entries].reverse();
      document.getElementById('storyBody').innerHTML = `<div class="story-entries">
        ${rev.map(e => `<div class="story-entry">
          <div class="story-date">${esc(e.date)}</div>
          <div class="story-text">${esc(e.text)}</div>
        </div>`).join('')}
      </div>`;
    }

    /* Apply + fetch */

    function applyMarkdown(md, mode) {
      const text = String(md || '');
      if (!text.trim()) { setError('No content.'); return; }

      const tickets = parseV1(text);
      allTickets = tickets;
      const rnTables = parseRightNow(text);
      const researchTasks = parseResearchTasks(rnTables);
      const mergeLog = parseMergeLog(text);
      const storyLog = parseStoryLog(text);
      const groomed = buildGroomedSet(rnTables);

      renderGoal(tickets);
      renderWhatsNext(tickets, researchTasks);
      renderKanban(tickets, groomed, researchTasks);
      renderResearch(researchTasks);
      renderDone(tickets);
      renderBacklog(tickets, groomed, researchTasks);
      renderStory(storyLog);
      renderOwnership(tickets);
      renderMerge(mergeLog);

      lastText = text;
      sourceMode = mode;
      setError('');
      const now = new Date().toLocaleTimeString();
      if (mode === 'fetch') { setSource(`Auto \u00b7 ${now}`); startPolling(); }
      else if (mode === 'file') { setSource(`File \u00b7 ${now}`); stopPolling(); }
      else { setSource(`Paste \u00b7 ${now}`); stopPolling(); }
    }

    async function fetchTickets() {
      const r = await fetch(`TICKETS.md?ts=${Date.now()}`, { cache: 'no-store' });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.text();
    }

    async function loadFromFetch(notify) {
      try {
        const text = await fetchTickets();
        pasteArea.value = text;
        applyMarkdown(text, 'fetch');
      } catch (e) {
        stopPolling();
        setError('Auto-load failed \u2014 click "Upload" to load TICKETS.md, or serve via: python3 -m http.server 8080');
      }
    }

    function startPolling() {
      stopPolling();
      pollTimer = setInterval(async () => {
        try {
          const text = await fetchTickets();
          if (text !== lastText) applyMarkdown(text, 'fetch');
        } catch { stopPolling(); }
      }, 10000);
    }

    function stopPolling() {
      if (!pollTimer) return;
      clearInterval(pollTimer);
      pollTimer = null;
    }

    loadFromFetch(true);
  </script>
</body>
</html>
